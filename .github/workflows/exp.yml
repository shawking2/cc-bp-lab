name: bp-exp
on:
  push:
    branches: ['exp/**']
permissions:
  contents: write
  pull-requests: write
jobs:
  exp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: context + token perms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "actor=${{ github.actor }}  repo=${{ github.repository }}"
          echo "=== token repo permissions ==="
          gh api repos/${{ github.repository }} -q '.permissions' || true
          echo "=== token login (should be actions bot, not a user) ==="
          gh api user 2>&1 | head -3 || echo "no user (token is installation/actions)"

      - name: E1 direct push to protected main via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "exp-bot"
          git config user.email "exp-bot@users.noreply.github.com"
          git checkout -q main
          echo "E1 $(date +%s)" > E1-DIRECT-PUSH.txt
          git add E1-DIRECT-PUSH.txt
          git commit -q -m "E1 direct push attempt"
          echo "--- git push origin HEAD:main ---"
          git push origin HEAD:main > e1.log 2>&1
          EX=$?
          cat e1.log
          echo "E1_PUSH_EXIT=$EX"
          AFTER=$(gh api repos/${{ github.repository }}/contents/E1-DIRECT-PUSH.txt --jq '.name' 2>/dev/null)
          if [ "$AFTER" = "E1-DIRECT-PUSH.txt" ]; then echo "E1_RESULT=BYPASS_FILE_ON_MAIN"; else echo "E1_RESULT=BLOCKED"; fi

      - name: E2 create PR then plain merge via GITHUB_TOKEN (no review)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BR="exp-e2-${{ github.run_id }}"
          git checkout -q main
          git checkout -q -b "$BR"
          echo "E2 $(date +%s)" > E2-PR-MERGE.txt
          git add E2-PR-MERGE.txt && git commit -q -m "E2 content"
          git push -q origin "$BR"
          NUM=$(gh pr create --base main --head "$BR" --title "E2 token-merge" --body benign --jq '.number' 2>/dev/null)
          [ -z "$NUM" ] && NUM=$(gh pr list --head "$BR" --json number --jq '.[0].number')
          echo "E2_PR=#$NUM"
          echo "--- plain merge (no approval) ---"
          gh pr merge "$NUM" --merge > e2.log 2>&1
          echo "E2_MERGE_EXIT=$?"; cat e2.log
          echo "E2_MERGED=$(gh api repos/${{ github.repository }}/pulls/$NUM --jq '.merged')"

      - name: E2b force merge with --admin via GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          NUM=$(gh pr list --head "exp-e2-${{ github.run_id }}" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then
            echo "--- gh pr merge --admin on #$NUM ---"
            gh pr merge "$NUM" --merge --admin > e2b.log 2>&1
            echo "E2b_EXIT=$?"; cat e2b.log
            echo "E2b_MERGED=$(gh api repos/${{ github.repository }}/pulls/$NUM --jq '.merged')"
          else
            echo "E2b_SKIP (no open PR; E2 may have merged)"
          fi

      - name: E3 self-approve via GITHUB_TOKEN then merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          BR="exp-e3-${{ github.run_id }}"
          git checkout -q main
          git checkout -q -b "$BR"
          echo "E3 $(date +%s)" > E3-SELFAPPROVE.txt
          git add E3-SELFAPPROVE.txt && git commit -q -m "E3 content"
          git push -q origin "$BR"
          NUM=$(gh pr create --base main --head "$BR" --title "E3 self-approve" --body benign --jq '.number' 2>/dev/null)
          [ -z "$NUM" ] && NUM=$(gh pr list --head "$BR" --json number --jq '.[0].number')
          echo "E3_PR=#$NUM"
          echo "--- approve via GITHUB_TOKEN (Actions bot) ---"
          gh api -X POST repos/${{ github.repository }}/pulls/$NUM/reviews -f event=APPROVE -f body="auto-approve" > e3app.log 2>&1
          echo "E3_APPROVE_EXIT=$?"; cat e3app.log
          echo "--- reviews on PR ---"
          gh api repos/${{ github.repository }}/pulls/$NUM/reviews --jq '.[] | .user.login + " " + .state' 2>&1
          echo "--- merge after self-approve ---"
          gh pr merge "$NUM" --merge > e3.log 2>&1
          echo "E3_MERGE_EXIT=$?"; cat e3.log
          echo "E3_MERGED=$(gh api repos/${{ github.repository }}/pulls/$NUM --jq '.merged')"
